# Apollo Ops Expert 的 DSH bundle patch。
# 插件是双面包：host 面（RPC 后端，lib/index.js）与 client 面（Web GUI，lib/client.js）
# 通过同一个 browser roster 条目加载 —— modules node half 扫描该行组成 window.__DSH_BOOT__，
# host 侧加载包的 exports["."]，浏览器侧加载 exports["./client"]。
- insert:
    - id: ui-apollo-ops
      name: '@apollo-ops/dsh-client-ui-apollo-ops'
      config:
        # 部署安全开关；未显式关闭即允许（插件内部按 === false 才拒绝）。
        allowFileWrite: true
        allowTerminal: true
        allowRestore: true
