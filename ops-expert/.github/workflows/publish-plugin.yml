name: Publish plugin to npm

# 通过 npm Trusted Publishing (OIDC) 发布 plugin/，不需要 token、不需要 2FA。
# 前置（只需配置一次）：
#   npmjs.com → 该包 → Settings → Trusted Publisher → GitHub Actions
#     Organization/user: apollo-ops
#     Repository:        apollo-ops
#     Workflow filename: publish-plugin.yml
# 之后：打 tag 或手动触发即可发布。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（需与 plugin/package.json 一致）'
        required: false
  push:
    tags:
      - 'plugin-v*'

permissions:
  contents: read
  id-token: write # OIDC trusted publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 要求较新的 npm
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Show package identity
        working-directory: plugin
        run: node -e "const p=require('./package.json');console.log(p.name+'@'+p.version)"

      - name: Pack preview
        working-directory: plugin
        run: npm pack --dry-run

      - name: Publish
        working-directory: plugin
        run: npm publish --access public --provenance
