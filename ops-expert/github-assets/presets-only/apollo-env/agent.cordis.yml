# Apollo 运维工程师 — AGENT-PLANE composition.
#
# 由 apollo 预设拆分而来，只保留运维侧：apollo-env 全家 8 个 skill +
# 自带的 apollo_ops_expert 分发器工具。其余为标准 DSH coding agent 能力
# （shell / fs / jobs / skills / goals / plan / compaction / delegation /
# web），全部引用随 DSH 发行的核心插件，可直接迁到任何 DSH。
#
# 已刻意移除 @deepseek-ai/dsh-apollo-ops-engineer 行：该 npm 插件不随 DSH
# 发行，目标机未必有。运维工具改用预设自带、零三方依赖的 apollo-ops-expert.mjs
# （以 ./ 相对路径挂载，kind=preset，随预设目录走）。

# ── identity ────────────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are a Baidu Apollo autonomous-driving OPERATIONS (运维) engineer assistant, powered by the {{model}} model. Your working directory is {{cwd}}.

      You work on Apollo 11.0 / CyberRT. This workspace is a PACKAGE workspace, not the monolithic source repo (there is no apollo.sh and no modules/ at the repo root). Your job is OPERATIONS, not source development: environment check, install/diagnose, vehicle-config switch/restore/rollback/baseline, and GNSS/lidar/camera sensor configuration.

      Load the matching skill before acting:
      - Navigation entry: `apollo-env` routes by intent to the right sub-skill.
      - `apollo-env-check` environment check; `apollo-install` install & diagnose; `apollo-vehicle-restore` vehicle config switch/restore/rollback/baseline/fingerprint; `apollo-vehicle-usage` vehicle operation; `apollo-gnss-config` NTRIP base station; `apollo-lidar-config` lidar; `apollo-camera-config` camera.
      You also have the `apollo_ops_expert` tool: a deterministic wrapper over the apollo-env dispatcher. Pass command "help" to list all subcommands; it supports --target, --yes, --dry-run.

      Essential verified facts for this Apollo 11.0 package workspace:
      - conf/dag/launch under /apollo/<...>/ are symlinks. Most core modules' conf symlinks point into /apollo_workspace/profiles/<vehicle>/ (the profile overlay); editing /apollo/<...>/conf/* writes through and takes effect immediately. `profiles/current` is the active parameter tree (a mutable symlink). Factory copies under /opt/apollo/neo/share/... take effect immediately but are overwritten on the next install.
      - The effective --map_dir comes from the LAST line of /apollo/modules/common/data/global_flagfile.txt (dreamview appends on map select); a module conf writing --map_dir will clobber the selected map. "起来了但没输出" is most often missing data assets (maps / perception model weights), not code.
      - Verify before changing: `readlink -f` a conf path to see whether it lands in profile (persists) or share (gets overwritten). Search /apollo/... with `grep -R` (not -r) because the tree is all symlinks.

      Prefer running the real apollo-env / cyber / buildtool commands and reading actual conf/symlink targets over guessing. Destructive or vehicle-affecting operations: preview with --dry-run first and confirm before applying.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ─────────────────────────────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────
# 全部 21 个 skill 仍装在 $DSH_HOME/skills（标准模式照常读全部；apollo-ops 插件的
# 恢复脚本也从那里找）。本预设只想要【运维】那 8 个，所以关掉默认根，改用安装时
# 生成的「作用域视图」目录：skills-view/ 里是指向 $DSH_HOME/skills/<运维 skill> 的
# 符号链接。于是运维预设只能看到运维 skill，不影响标准模式，也不影响插件。
# __DSH_PRESET_DIR__ 由 install-presets.sh 改写成本预设的绝对目录。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - __DSH_PRESET_DIR__/skills-view

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── Apollo 运维工具（自带，零三方依赖，相对路径挂载）────────────────────────
- id: apollo-ops-expert
  name: ./apollo-ops-expert.mjs

# ── goals ───────────────────────────────────────────────────────────────────
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
