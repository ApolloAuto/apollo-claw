schema_version: 1
common_linked_files:
  pointcloud_channel:
  - path: /apollo/modules/perception/pointcloud_preprocess/dag/pointcloud_preprocess.dag
    field: readers.channel
    risk: low
    desc: 感知预处理订阅
  - path: /apollo/modules/loam_velodyne/conf/laser_odometry_conf.pb.txt
    field: pointCloudTopic
    risk: low
    desc: 激光里程计订阅
  - path: /apollo/modules/slam_local/conf/laser_odometry_conf.pb.txt
    field: pointCloudTopic
    risk: low
    desc: SLAM 定位订阅
  - path: /apollo/modules/localization/conf/msf_localization.pb.txt
    field: lidar_topic
    risk: low
    desc: MSF 定位订阅
  - path: /apollo/modules/drivers/lidar/dag/lidar.dag
    field: readers.channel
    risk: low
    desc: 补偿器订阅
  - path: /apollo/modules/dreamview_plus_plugins/calibration_tool/conf/calibration_conf.pb.txt
    field: lidar_channel
    risk: high
    desc: 标定工具（多处）
  - path: /apollo/modules/private_tools/tile_map_images_creator/conf/image_creator_conf.pb.txt
    field: point_cloud_channel
    risk: low
    desc: 地图图像工具
  frame_id:
  - path: /apollo/modules/transform/conf/static_transform_conf.pb.txt
    field: child_frame_id
    risk: high
    desc: TF 静态外参（imu→lidar）
  - path: /apollo/modules/perception/data/params/lidar16_back_extrinsics.yaml
    field: child_frame_id
    risk: high
    desc: 雷达外参文件（文件名可能需同步改）
  - path: /apollo/modules/perception/data/conf/sensor_meta.pb.txt
    field: name
    risk: high
    desc: 感知传感器元数据
  - path: /apollo/modules/perception/multi_sensor_fusion/data/dst_type_fusion.pb.txt
    field: name
    risk: high
    desc: 感知融合
  - path: /apollo/modules/perception/pointcloud_preprocess/conf/pointcloud_preprocess_config.pb.txt
    field: sensor_name
    risk: high
    desc: 感知预处理传感器名
  - path: /apollo/modules/loam_velodyne/conf/laser_odometry_conf.pb.txt
    field: lidarFrame
    risk: low
    desc: 激光里程计 frame
  - path: /apollo/modules/dreamview_plus_plugins/calibration_tool/conf/calibration_conf.pb.txt
    field: lidar_frame_id
    risk: high
    desc: 标定工具 frame
lidars:
- model: HESAI40P
  vendor: hesai
  driver_conf: /apollo/modules/drivers/lidar/hesai/conf/hesai40p.pb.txt
  compensator_conf: /apollo/modules/drivers/lidar/hesai/conf/hesai40p_compensator.pb.txt
  dag: /apollo/modules/drivers/lidar/hesai/dag/hesai40.dag
  launch: /apollo/modules/drivers/lidar/hesai/launch/hesai40.launch
  fields:
  - concept: model
    field: model
    location: top
    default: HESAI40P
    interactive: true
    choices: &id001
    - HESAI40P
    - HESAI64
    desc: 雷达型号
    model_configs:
      HESAI40P: &id002 {}
      HESAI64: &id003 {}
  - concept: device_ip
    field: ip
    location: top
    default: 192.168.20.13
    interactive: true
    desc: 雷达设备 IP
  - concept: data_port
    field: lidar_recv_port
    location: top
    default: 2368
    interactive: true
    desc: 点云端口
  - concept: aux_port
    field: gps_recv_port
    location: top
    default: 8308
    interactive: true
    desc: GPS/PPS 端口
  - concept: frame_id
    field: frame_id
    location: top
    default: lidar16_back
    interactive: true
    desc: TF 帧 ID
  - concept: pointcloud
    field: pointcloud_channel
    location: top
    default: /apollo/sensor/hesai40/PointCloud2
    interactive: true
    desc: 点云 channel
  - concept: scan
    field: scan_channel
    location: top
    default: /apollo/sensor/hesai40/Scan
    interactive: true
    desc: 扫描 channel
